name: Build Kotoba APK

on:
workflow_dispatch:

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4

  - name: Extract project
    run: |
      mkdir project
      unzip -q kotoba-learn-russian-fixed.zip -d project
      find project -maxdepth 4 -type f | head -100

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.7'

  - name: Show project structure
    run: |
      find project -name settings.gradle -o -name settings.gradle.kts
      find project -name gradlew

  - name: Build APK
    run: |
      cd project
      SETTINGS="$(find . -name settings.gradle -o -name settings.gradle.kts | head -1)"
      if [ -z "$SETTINGS" ]; then
        echo "Gradle settings file not found"
        exit 1
      fi
      DIR="$(dirname "$SETTINGS")"
      cd "$DIR"
      gradle assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: kotoba-debug-apk
      path: project/**/build/outputs/apk/debug/*.apk
      if-no-files-found: error
      retention-days: 30
